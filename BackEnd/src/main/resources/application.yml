spring:
  application:
    name: procurement
  datasource:
    # DB_URL is mandatory outside the dev/local/test profiles: startup fails fast when it is missing (DR-14).
    # DB_USERNAME / DB_PASSWORD are only needed for SQL Server authentication.
    url: ${DB_URL}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: procurement-db
      # Pool-wide wait for a connection. Kept moderate so ordinary requests do not fail under short load peaks
      # (CR-26); the status probe has its own 1.5 s deadline, so the status page still answers DOWN quickly.
      connection-timeout: 5000
      # A statement waits at most this long for a row lock, then fails with SQL Server error 1222, which the API
      # answers as 503 "busy". Without it a reader waits for a writer without limit (audit DB-3). Set once per
      # pooled connection; application locks (sp_getapplock) keep their own shorter timeout.
      connection-init-sql: SET LOCK_TIMEOUT ${app.database.lock-timeout-ms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Instants are stored as DATETIME2(3) in UTC (DR-17).
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.jdbc.time_zone: UTC
      # Lists map entities with their lines: fetch those in batches instead of one query per request.
      hibernate.default_batch_fetch_size: 50
  transaction:
    # Upper bound for any transaction, also applied to its statements as a query timeout (audit DB-3).
    default-timeout: ${app.database.transaction-timeout}
  flyway:
    locations: classpath:db/migration
    # Missing repeatable (demo) migrations are tolerated only by the dev/local/test profiles (CR-28): outside
    # development, a migration recorded in the database but absent from the build is an error.
    ignore-migration-patterns: "*:future"
    # Schema changes must never be destroyed by tooling outside tests.
    clean-disabled: true
  servlet:
    multipart:
      # Attachments (S2-AC-12): 20 MB per file; the service re-checks the size and the per-request limits.
      max-file-size: 20MB
      max-request-size: 21MB
  mail:
    # Only used with app.mail.mode=smtp (production). Never commit credentials.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true

logging:
  pattern:
    # Request id and user id in front of every line written while a request runs (RequestIdFilter, audit A-2).
    # For JSON lines in a deployment set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs: the same two fields are included.
    correlation: "[%X{requestId:-},%X{userId:-}] "

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      # Backstop only: the application enforces the idle and absolute timeouts itself (app.security.session).
      timeout: 31m
      cookie:
        name: EPI_SESSION
        http-only: true
        same-site: lax
        secure: ${app.security.cookie-secure:true}

app:
  # Name of the deployed environment (uat, staging, production). Leave empty on a developer machine. Startup is
  # refused when a development profile is combined with a deployed environment (audit S-15).
  environment: ${APP_ENVIRONMENT:}
  database:
    lock-timeout-ms: ${DB_LOCK_TIMEOUT_MS:10000}
    transaction-timeout: ${DB_TRANSACTION_TIMEOUT:30s}
  retention:
    # Link tokens (approval, quote, password) are deleted this long after they expired (audit DB-4).
    expired-tokens: P90D
  security:
    # Secure cookies (HTTPS only). Disabled by the dev/local/test profiles, which run over plain HTTP.
    cookie-secure: true
    # Immediate TCP peers allowed to supply X-Forwarded-For / Forwarded (S2CR-08). Empty = never trust headers.
    trusted-proxies: ${APP_TRUSTED_PROXIES:}
    session:
      idle-timeout: 30m
      absolute-timeout: 8h
    login:
      max-failures-per-account: 5
      max-failures-per-address: 50
      window: 15m
      block-duration: 15m
    # Sprint 10 password setup/reset (public redeem is rate-limited with proxy-aware client address).
    password-reset-ttl: PT24H
    password-reset-rate-limit-per-minute: 20
  request:
    max-lines: 100
  # Base URL of the Angular application, used in e-mail links (one-tap approval, request pages).
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:4200}
  mail:
    # smtp (sends e-mail) | file (.eml files in app.mail.directory; they contain live links) | failing (tests).
    # No default outside the development profiles: startup fails until MAIL_MODE is chosen (audit S-16).
    mode: ${MAIL_MODE:}
    directory: ${MAIL_DIRECTORY:storage/mail}
    from: ${MAIL_FROM:no-reply@procurement.local}
  storage:
    directory: ${STORAGE_DIRECTORY:storage/files}
  attachments:
    # Without an antivirus adapter, uploaded files are stored as PENDING. They can be downloaded only when this is
    # true; outside development that is a risk the owner must accept in writing (audit S-1).
    allow-unscanned-downloads: ${APP_ALLOW_UNSCANNED_DOWNLOADS:false}
  approval:
    # One-tap approval link lifetime (S2-AC-07).
    link-ttl: PT72H
    # Minutes per SLA "hour" of an approval rule stage; tests may shorten it (QA hook A1).
    sla-unit-minutes: 60
    link-rate-limit-per-minute: 30
    link-rate-limit-per-token-per-minute: 10
  sourcing:
    quote-link-rate-limit-per-minute: 30
    quote-link-rate-limit-per-token-per-minute: 10
  jobs:
    enabled: true
    outbox-delay: PT15S
    reminder-delay: PT1M
  # Sprint 12 assistant (ADR-012). Default disabled — no external model calls.
  assistant:
    mode: ${APP_ASSISTANT_MODE:disabled}
    timeout: PT20S
    rate-limit-per-minute: 30
    max-question-chars: 2000
    max-context-chars: 12000

management:
  health:
    # The SMTP server is not a dependency of the application's health (the outbox retries).
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        # metrics: timings per endpoint, connection pool, JVM, outbox backlog, open streams (audit A-2, D-5).
        # Everything except health and info is restricted to global administrators (SecurityConfiguration).
        include: health,info,metrics
  endpoint:
    health:
      # Anonymous callers get only {"status":"UP"|"DOWN"}; administrators see the components (S1-AC-13).
      show-components: when-authorized
      show-details: when-authorized
      roles: ADMIN
      # Kubernetes liveness/readiness groups are not used yet (single node, ADR-003); enable them with the first
      # container deployment. The external check uses /actuator/health, which includes the database.
      probes:
        enabled: false
  info:
    env:
      enabled: false

# API documentation is off by default, enabled only by the dev profile (QA-D-07) and restricted to administrators.
springdoc:
  api-docs:
    enabled: false
    path: /api/v1/openapi
  swagger-ui:
    enabled: false
    path: /api/v1/docs
