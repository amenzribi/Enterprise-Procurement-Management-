# Notification e-mails and in-app notifications - English (default). Placeholders: {number} {title} {actor}
# {requester} {company} {amount} {requiredDate} {stage} {onBehalfOf} {text}. Kept in sync with _fr and _ar.
mail.footer=Enterprise Procurement Intelligence - automatic message, please do not reply.
mail.label.number=Request
mail.label.title=Title
mail.label.requester=Requester
mail.label.company=Company
mail.label.amount=Amount
mail.label.requiredDate=Required by
mail.label.stage=Approval stage
mail.label.lines=Lines
mail.action.approve=Approve
mail.action.review=Review
mail.action.open=Open the request
mail.TASK_ASSIGNED.subject=[{number}] Approval needed: {title}
mail.TASK_ASSIGNED.intro={requester} asks for your approval ({stage}).
mail.TASK_DELEGATED.subject=[{number}] Approval delegated to you: {title}
mail.TASK_DELEGATED.intro={actor} delegated this approval to you ({stage}).
mail.TASK_REMINDER.subject=[{number}] Reminder: approval waiting for you
mail.TASK_REMINDER.intro=This request has been waiting for your approval longer than agreed ({stage}).
mail.TASK_ESCALATION.subject=[{number}] Escalation: approval overdue
mail.TASK_ESCALATION.intro=The approval by {onBehalfOf} ({stage}) is overdue. You are informed as escalation contact.
mail.QUESTION_ASKED.subject=[{number}] Question about your request
mail.QUESTION_ASKED.intro={actor} has a question about your request. Please answer it from the request page.
mail.QUESTION_ANSWERED.subject=[{number}] Your question was answered
mail.QUESTION_ANSWERED.intro={actor} answered your question.
mail.QUESTION_SUPERSEDED.subject=[{number}] Question closed
mail.QUESTION_SUPERSEDED.intro={actor} decided without waiting for your answer; the question is closed.
mail.REQUEST_RETURNED.subject=[{number}] Returned for revision
mail.REQUEST_RETURNED.intro={actor} returned your request for revision. Please correct it and submit it again.
mail.REQUEST_REJECTED.subject=[{number}] Request rejected
mail.REQUEST_REJECTED.intro={actor} rejected your request.
mail.REQUEST_APPROVED.subject=[{number}] Approved - sent to central purchasing
mail.REQUEST_APPROVED.intro=Your request is approved and sent to central purchasing.
mail.BUYER_ASSIGNED.subject=[{number}] Assigned to purchasing: {title}
mail.BUYER_ASSIGNED.intro={actor} assigned this request to a buyer.
mail.BUYER_ACCEPTED.subject=[{number}] Buyer accepted: {title}
mail.BUYER_ACCEPTED.intro={actor} accepted the assignment.
mail.BUYER_RETURNED.subject=[{number}] Buyer returned the assignment
mail.BUYER_RETURNED.intro={actor} returned the assignment.
mail.PURCHASING_RETURNED.subject=[{number}] Purchasing needs more information
mail.PURCHASING_RETURNED.intro={actor} returned your request from purchasing. Please complete it and submit it again. Approval will not restart.
mail.NO_ELIGIBLE_APPROVER.subject=Approval rules: no eligible approver for {company}
mail.NO_ELIGIBLE_APPROVER.intro=A submission was refused because the stage "{stage}" has no eligible approver. Please review the approval rules and role assignments.
