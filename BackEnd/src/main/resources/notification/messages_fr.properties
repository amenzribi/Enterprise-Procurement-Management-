mail.TASK_ASSIGNED.subject=[{number}] Validation requise : {title}
mail.TASK_ASSIGNED.intro={requester} demande votre validation ({stage}).
mail.TASK_DELEGATED.subject=[{number}] Validation déléguée : {title}
mail.TASK_DELEGATED.intro={actor} vous a délégué cette validation ({stage}).
mail.TASK_REMINDER.subject=[{number}] Rappel : validation en attente
mail.TASK_REMINDER.intro=Cette demande attend votre validation au-delà du délai convenu ({stage}).
mail.TASK_ESCALATION.subject=[{number}] Escalade : validation en retard
mail.TASK_ESCALATION.intro=La validation de {onBehalfOf} ({stage}) est en retard. Vous êtes informé(e) en tant que contact d'escalade.
mail.QUESTION_ASKED.subject=[{number}] Question sur votre demande
mail.QUESTION_ASKED.intro={actor} a une question sur votre demande. Merci d'y répondre depuis la page de la demande.
mail.QUESTION_ANSWERED.subject=[{number}] Réponse à votre question
mail.QUESTION_ANSWERED.intro={actor} a répondu à votre question.
mail.QUESTION_SUPERSEDED.subject=[{number}] Question clôturée
mail.QUESTION_SUPERSEDED.intro={actor} a décidé sans attendre votre réponse ; la question est clôturée.
mail.REQUEST_RETURNED.subject=[{number}] Renvoyée pour révision
mail.REQUEST_RETURNED.intro={actor} a renvoyé votre demande pour révision. Merci de la corriger puis de la soumettre à nouveau.
mail.REQUEST_REJECTED.subject=[{number}] Demande rejetée
mail.REQUEST_REJECTED.intro={actor} a rejeté votre demande.
mail.REQUEST_APPROVED.subject=[{number}] Validée - transmise à la centrale d'achat
mail.REQUEST_APPROVED.intro=Votre demande est validée et transmise à la centrale d'achat.
mail.BUYER_ASSIGNED.subject=[{number}] Affectée aux achats : {title}
mail.BUYER_ASSIGNED.intro={actor} a affecté cette demande à un acheteur.
mail.BUYER_ACCEPTED.subject=[{number}] Acheteur a accepté : {title}
mail.BUYER_ACCEPTED.intro={actor} a accepté l'affectation.
mail.BUYER_RETURNED.subject=[{number}] L'acheteur a rendu l'affectation
mail.BUYER_RETURNED.intro={actor} a rendu l'affectation.
mail.PURCHASING_RETURNED.subject=[{number}] Les achats ont besoin d'informations
mail.PURCHASING_RETURNED.intro={actor} a renvoyé votre demande depuis les achats. Complétez-la et soumettez-la à nouveau. Le circuit de validation ne redémarre pas.
mail.PURCHASING_QUESTION.subject=[{number}] Question achats sur votre demande
mail.PURCHASING_QUESTION.intro={actor} a demandé : {question}
mail.RFQ_CREATED.subject=[{number}] Consultation lancée : {title}
mail.RFQ_CREATED.intro={actor} a ouvert une demande de devis pour votre achat.
mail.TECHNICAL_VALIDATION.subject=[{number}] Validation technique enregistrée
mail.TECHNICAL_VALIDATION.intro={actor} a enregistré la validation technique.
mail.COMMERCIAL_VALIDATION.subject=[{number}] Validation commerciale enregistrée
mail.COMMERCIAL_VALIDATION.intro={actor} a enregistré la validation commerciale.
mail.AWARD_RECORDED.subject=[{number}] Fournisseur attribué : {title}
mail.AWARD_RECORDED.intro={actor} a enregistré la décision d’attribution.
mail.PO_ISSUED.subject=[{number}] Bon de commande émis
mail.PO_ISSUED.intro={actor} a émis le bon de commande.
mail.PO_CONFIRMED.subject=[{number}] Bon de commande confirmé
mail.PO_CONFIRMED.intro={actor} a enregistré la confirmation fournisseur.
mail.SHIPMENT_CREATED.subject=[{number}] Expédition créée : {title}
mail.SHIPMENT_CREATED.intro={actor} a créé une expédition pour votre demande.
mail.SHIPMENT_DELAY.subject=[{number}] Jalon d’expédition en retard
mail.SHIPMENT_DELAY.intro={actor} a enregistré ou consulté un jalon d’expédition en retard.
mail.RECEIPT_RECORDED.subject=[{number}] Réception enregistrée
mail.RECEIPT_RECORDED.intro={actor} a enregistré une réception pour votre demande.
mail.RECEIPT_CONFIRMED.subject=[{number}] Réception confirmée
mail.RECEIPT_CONFIRMED.intro={actor} a confirmé la réception.
mail.SERVICE_ACCEPTED.subject=[{number}] Prestation acceptée
mail.SERVICE_ACCEPTED.intro={actor} a enregistré l’acceptation de la prestation.
mail.INVOICE_RECORDED.subject=[{number}] Facture fournisseur enregistrée
mail.INVOICE_RECORDED.intro={actor} a enregistré la facture finale.
mail.REQUEST_CLOSED.subject=[{number}] Demande clôturée
mail.REQUEST_CLOSED.intro={actor} a confirmé la clôture de la demande.
mail.NO_ELIGIBLE_APPROVER.subject=Circuits de validation : aucun valideur pour {company}
mail.NO_ELIGIBLE_APPROVER.intro=Une soumission a été refusée car l'étape « {stage} » n'a aucun valideur éligible. Merci de vérifier les circuits et les rôles.

mail.action.setPassword=Definir le mot de passe
mail.PASSWORD_SETUP.subject=Configurer votre compte achats
mail.PASSWORD_SETUP.intro=Bonjour {displayName}. Un administrateur a cree votre compte. Utilisez le bouton ci-dessous pour choisir un mot de passe (lien a usage unique, duree limitee).
mail.PASSWORD_RESET.subject=Reinitialiser votre mot de passe
mail.PASSWORD_RESET.intro=Bonjour {displayName}. Un administrateur a demande une reinitialisation. Utilisez le bouton ci-dessous pour choisir un nouveau mot de passe (lien a usage unique, duree limitee).
mail.PASSWORD_RESET_SELF.subject=Reinitialiser votre mot de passe
mail.PASSWORD_RESET_SELF.intro=Bonjour {displayName}. Vous avez demande la reinitialisation de votre mot de passe. Utilisez le bouton ci-dessous pour en choisir un nouveau (lien a usage unique, duree limitee). Si vous n'avez rien demande, ignorez ce message : votre mot de passe n'a pas change.
mail.MESSAGE_RECEIVED.subject=[{number}] Nouveau message fournisseur
mail.MESSAGE_RECEIVED.intro={actor} a publie un message sur une conversation fournisseur. Ouvrez l'application pour le lire.
mail.MESSAGE_SUPPLIER.subject=[{number}] Nouveau message de l'acheteur
mail.MESSAGE_SUPPLIER.intro={actor} vous a envoye un message. Connectez-vous au portail fournisseur pour lire et repondre.
