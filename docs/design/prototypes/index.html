.list{list-style:none;margin:0;padding:0}

.qrow[aria-current=true]{background:var(--soft);box-shadow:inset 2px 0 0 var(--accent)}

const fmt=(n,c)=>new Intl.NumberFormat(S.lang==='ar'?'ar-TN-u-nu-latn':'en-GB').format(n)+' '+c;
const wait=h=>h>=48?Math.round(h/24)+(S.lang==='ar'?' يوم':' d'):h+(S.lang==='ar'?' س':' h');
const pending=()=>R.filter(r=>r.st==='appr'&&!S.done.has(r.id));
const stc={appr:'warn',src:'info',ord:'ok',ncf:'bad'},stl=s=>L()[s];
const esc=s=>String(s).replace(/[&<"]/g,c=>({'&':'&amp;','<':'&lt;','"':'&quot;'}[c]));
const narrow=()=>matchMedia('(max-width:760px)').matches;
function say(m){document.getElementById('live').textContent=m}
function go(p){Object.assign(S,p);render()}
function decide(id,el){const row=el||document.querySelector('[data-row="'+id+'"]');const f=()=>{S.done.add(id);say(L().decided+' '+id);const n=pending();S.sel=n[0]?n[0].id:null;S.open=false;render()};if(row&&!matchMedia('(prefers-reduced-motion:reduce)').matches){row.classList.add('leaving');setTimeout(f,S.d==='b'?320:S.d==='c'?240:180)}else f()}
function proto(){const b=(k,v,l)=>`<button aria-pressed="${S[k]==v}" data-p="${k}:${v}">${l}</button>`;document.getElementById('proto').innerHTML=`<span>Direction</span><div class=g>${b('d','a','A Ledger')+b('d','b','B Atelier')+b('d','c','C Nocturne')}</div><span>Screen</span><div class=g>${b('s','dashboard','Dashboard')+b('s','inbox','Inbox')+b('s','table','Table')+b('s','detail','Record')+b('s','signin','Sign-in')}</div><span>Language</span><div class=g>${b('lang','en','EN')+b('lang','ar','AR')}</div>${S.s==='signin'?`<span>Treatment</span><div class=g>${b('fx','true','2.5D')+b('fx','false','Static')}</div>`:''}<span>Synthetic data. Isolated preview.</span>`}
function shell(c){const l=L(),n=pending().length;const it=(s,t,x)=>`<button ${S.s===s?'aria-current=page':''} data-go="${s}"><span>${t}</span>${x?`<span class=count>${x}</span>`:''}</button>`;return `<div class=shell><nav class=rail aria-label="Main"><div class=brand>Procurement 360</div>${it('dashboard',l.dash)}${it('inbox',l.inbox,n)}${it('table',l.table)}${it('detail',l.detail)}<div class=who><b>Karim Haddad (Demo)</b>${l.view}</div></nav><main class=enter>${c}</main></div>`}
function decisionBlock(r){const l=L();return `<div class=facts><div><span class=lab>${l.amount}</span><b>${fmt(r.amt,r.cur)}</b></div><div><span class=lab>${l.budget}</span><b>${r.amt>30000?l.over:l.within}</b></div><div><span class=lab>${l.waiting}</span><b>${wait(r.wait)}</b></div><div><span class=lab>${l.due}</span><b>${r.due} ${l.days}</b></div></div><table class=cmp><caption class="lab" style="text-align:start;padding-block-end:6px">${l.quotes}</caption><thead><tr><th scope=col>${l.sup}</th><th scope=col class=n>${l.landed}</th><th scope=col class=n>${l.lead}</th></tr></thead><tbody>${QT.map((q,i)=>`<tr class="${i==0?'best':''}"><td>${q[0]}</td><td class="n num">${fmt(Math.round(r.amt*q[1]/4820),r.cur)}</td><td class="n num">${q[2]} ${l.days}</td></tr>`).join('')}</tbody></table>`}
function actions(r){const l=L();return `<div class=acts><button class="btn pri" data-decide="${r.id}">${l.approve}</button><button class=btn data-toast="${r.id}">${l.ret}</button><button class=btn data-rec="${r.id}">${l.open}</button></div>`}
function dashboard(){const l=L(),p=pending(),top=p[0];const row=r=>`<li><button class=qrow data-row="${r.id}" data-pick="${r.id}"><span><span class=t>${tr(r.t)}</span><br><small>${r.no} · ${r.by}</small></span><span class="r"><span class=num>${fmt(r.amt,r.cur)}</span><br><small>${wait(r.wait)}</small></span></button></li>`;
const next=top?`<section class="card next" aria-label="${l.next}"><div><span class=lab>${l.next}</span><h2 style="margin-block:4px">${tr(top.t)}</h2><small>${top.no} · ${fmt(top.amt,top.cur)} · ${l.waiting} ${wait(top.wait)}</small></div><button class="btn pri" data-pick="${top.id}">${l.review}</button></section>`:`<p class=empty>${l.done}</p>`;
const kp=`<section class="card kpis">${[[l.kv1,p.length],[l.kv2,2],[l.kv3,2],[l.kv4,3]].map(k=>`<div class=kpi><span class=lab>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</section>`;
const list=`<section class=card><ul class=list>${p.slice(1,6).map(row).join('')}</ul></section>`;
if(S.d==='b')return `<div class=lead><div><span class=lab>${l.hello}</span><p class=big>${p.length} ${l.pend}</p></div>${top?`<div class=tag><span class=lab>${l.oldest}</span><div style="font:400 22px/1.2 var(--display);margin-block:4px">${tr(top.t)}</div>${wait(top.wait)} · ${fmt(top.amt,top.cur)}</div>`:''}</div>${next}${list}`;
return `<div class=head><div><h1>${l.hello}</h1><p class=sub>${p.length} ${l.pend}</p></div></div>${S.d==='a'?kp+next:next+kp}${list}`}
function inbox(){const l=L(),p=pending();if(!S.sel||!p.find(r=>r.id===S.sel))S.sel=p[0]?.id||null;const cur=R.find(r=>r.id===S.sel);const head=`<div class=head><div><h1>${l.inbox}</h1><p class=sub>${l.sub}</p></div>${S.d==='c'?`<span class=lab><kbd>j</kbd> <kbd>k</kbd> ${l.keys}</span>`:''}</div>`;if(!cur)return head+`<p class="card empty">${l.done}</p>`;
const row=r=>`<button class=qrow data-row="${r.id}" data-sel="${r.id}" aria-current="${r.id===S.sel}"><span><span class=t>${tr(r.t)}</span><br><small>${r.no}</small></span><span class=r><span class=num>${fmt(r.amt,r.cur)}</span><br><small>${wait(r.wait)}</small></span></button>`;
const head2=r=>`<span class=lab>${r.no} · ${r.by}</span><h2>${tr(r.t)}</h2>`;
if(S.d==='a'){const pane=`<section class="card pane enter" aria-label="${l.context}" data-row="${cur.id}">${narrow()?`<button class=btn data-close style="margin-block-end:10px">${l.inbox}</button>`:''}${head2(cur)}${decisionBlock(cur)}${actions(cur)}</section>`;return head+`<div class=split><ul class="list card">${p.map(r=>`<li>${row(r)}</li>`).join('')}</ul>${narrow()?(S.open?`<div class=sheetwrap>${pane}</div>`:''):pane}</div>`}
if(S.d==='b'){const i=p.indexOf(cur);return head+`<div class=pager><span class=lab>${i+1} ${l.pos} ${p.length}</span><span class=acts><button class=btn ${i?'':'disabled'} data-sel="${p[Math.max(0,i-1)].id}">${l.prev}</button><button class=btn ${i<p.length-1?'':'disabled'} data-sel="${p[Math.min(p.length-1,i+1)].id}">${l.nxt}</button></span></div><section class="card focus enter" data-row="${cur.id}">${`<span class=lab>${cur.no} · ${cur.by}</span><h2>${tr(cur.t)}</h2>`}${decisionBlock(cur)}${actions(cur)}</section>`}
return head+`<ul class="list card acc">${p.map(r=>`<li>${row(r)}${r.id===S.sel?`<div class="open enter">${decisionBlock(r)}${actions(r)}</div>`:''}</li>`).join('')}</ul>`}
function table(){const l=L();let rows=R.filter(r=>(S.filter==='all'||r.st===S.filter)&&(!S.text||(r.no+tr(r.t)+r.by).toLowerCase().includes(S.text.toLowerCase())));const k={no:r=>r.no,title:r=>tr(r.t),st:r=>r.st,amt:r=>r.amt,wait:r=>r.wait}[S.sort];rows=[...rows].sort((a,b)=>(k(a)>k(b)?1:k(a)<k(b)?-1:0)*(S.asc?1:-1));const th=(key,lab,n)=>`<th scope=col class="${n?'n':''}" ${S.sort===key?`aria-sort="${S.asc?'ascending':'descending'}"`:''}><button data-sort="${key}">${lab}<span aria-hidden=true>${S.sort===key?(S.asc?'↑':'↓'):''}</span></button></th>`;const chip=(f,t)=>`<button class=chip aria-pressed="${S.filter===f}" data-filter="${f}">${t}</button>`;
return `<div class=head><div><h1>${l.table}</h1></div></div><div class=tools><label class=sr for=s>${l.search}</label><input class=search id=s placeholder="${l.search}" value="${esc(S.text)}">${chip('all',l.all)+chip('appr',l.appr)+chip('src',l.src)+chip('ord',l.ord)+chip('ncf',l.ncf)}</div><section class=card>${rows.length?`<table class=grid><thead><tr>${th('no',l.num)+th('title',l.title)+th('st',l.st)+th('amt',l.tot,1)+th('wait',l.upd,1)}</tr></thead><tbody>${rows.map(r=>`<tr data-rec="${r.id}"><td><button class=link data-rec="${r.id}">${r.no}</button></td><td class=hm>${tr(r.t)}</td><td><span class="st ${stc[r.st]}">${stl(r.st)}</span></td><td class="n num">${fmt(r.amt,r.cur)}</td><td class="n num hm">${wait(r.wait)}</td></tr>`).join('')}</tbody></table><div class=foot>${l.showing} ${rows.length} / ${R.length}</div>`:`<div class=empty><p>${l.none}</p><button class=btn data-clear>${l.clear}</button></div>`}</section>`}
function detail(){const l=L(),r=R.find(x=>x.id===S.rec)||R[0],can=r.st==='appr'&&!S.done.has(r.id),bad=r.st==='ncf';const ev=[['Submitted','تم الإرسال',r.by,'04 Nov 09:12'],['Routed to department manager','أُحيل إلى مدير القسم','System','04 Nov 09:12'],['Budget check passed','اجتياز فحص الميزانية','System','04 Nov 09:13'],['Awaiting your decision','بانتظار قرارك','Karim Haddad (Demo)','now']];
const act=can?`<p>${l.nextB}</p><button class="btn pri" data-decide="${r.id}">${l.approve}</button><button class=btn data-toast="${r.id}">${l.ret}</button>`:bad?`<div class=blocked>${l.blocked}</div>`:`<p>${l.done}</p>`;
return `<div class=head data-row="${r.id}"><div><span class=lab>${r.no}</span><h1>${tr(r.t)}</h1><p class=sub><span class="st ${stc[r.st]}">${stl(r.st)}</span> · ${l.requester}: ${r.by}</p></div></div><div class=dgrid><div><section class="card sect"><h2>${l.context}</h2>${decisionBlock(r)}</section><section class="card sect"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${l.history}</h2><button class=btn aria-expanded="${S.hist}" data-hist>${S.hist?l.hide:l.show}</button></div>${S.hist?`<ol class="tl enter">${ev.map((e,i)=>`<li class="${i==3?'cur':''}"><b>${e[S.lang==='ar'?1:0]}</b><br><small>${e[2]} · ${e[3]}</small></li>`).join('')}</ol>`:''}</section></div><aside class="card nextcard" aria-label="${l.nextA}"><span class=lab>${l.nextA}</span>${act}</aside></div>${can?`<div class=bar><span class=num>${fmt(r.amt,r.cur)}</span><button class="btn pri" data-decide="${r.id}">${l.approve}</button></div>`:''}`}
function signin(){const l=L(),fx=S.fx&&!matchMedia('(prefers-reduced-motion:reduce)').matches;return `<div class=signin><div class=formside><div class=brand style="padding:0;font-size:22px">Procurement 360</div><h1>${l.signin}</h1><div><label for=e>${l.email}</label><input id=e autocomplete=off></div><div><label for=p>${l.pw}</label><input id=p type=password></div><button class="btn pri">${l.signin}</button></div><div class="art ${fx?'fx':'nofx'}" aria-hidden=true><div class=stack id=stack><div class=sheet></div><div class=sheet></div><div class=sheet><span class=lab>DEMO-PR-2641</span><i style="width:70%"></i><i></i><i style="width:85%"></i><i style="width:40%;margin-block-start:auto;background:var(--accent)"></i></div></div></div></div>`}
function render(){document.documentElement.dataset.d=S.d;document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';proto();const c={dashboard,inbox,table,detail}[S.s];document.getElementById('app').innerHTML=S.s==='signin'?signin():shell(c());const u=new URLSearchParams(location.search);['d','s','lang'].forEach(k=>u.set(k,S[k]));history.replaceState(null,'','?'+u)}
document.addEventListener('click',e=>{const t=e.target.closest('button,tr[data-rec]');if(!t)return;const d=t.dataset;if(d.p){const[k,v]=d.p.split(':');go({[k]:k==='fx'?v==='true':v});}
else if(d.go)go({s:d.go});
else if(d.pick)go({s:'inbox',sel:d.pick,open:true});
else if(d.sel)go({sel:d.sel,open:true});
else if(d.rec)go({s:'detail',rec:d.rec,hist:false});
else if('close'in d)go({open:false});
else if(d.decide)decide(d.decide);
else if(d.toast)say(L().ret+' '+d.toast);
else if(d.filter)go({filter:d.filter});
else if(d.sort)go(S.sort===d.sort?{asc:!S.asc}:{sort:d.sort,asc:false});
else if('hist'in d)go({hist:!S.hist});
else if('clear'in d)go({filter:'all',text:''});
});
document.addEventListener('input',e=>{if(e.target.id==='s'){S.text=e.target.value;render();const i=document.getElementById('s');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
document.addEventListener('keydown',e=>{if(S.d!=='c'||S.s!=='inbox'||e.target.matches('input'))return;const p=pending(),i=p.findIndex(r=>r.id===S.sel);if(e.key==='j'&&i<p.length-1)go({sel:p[i+1].id});if(e.key==='k'&&i>0)go({sel:p[i-1].id})});
document.addEventListener('pointermove',e=>{const s=document.getElementById('stack');if(!s||!S.fx||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const x=(e.clientX/innerWidth-.5)*8,y=(e.clientY/innerHeight-.5)*-6;s.style.transform=`rotateY(${x}deg) rotateX(${y}deg)`});
addEventListener('resize',()=>S.s==='inbox'&&render());
render();
</script>
</body>
</html>
